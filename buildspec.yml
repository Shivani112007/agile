version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install -r requirements.txt
  build:
    commands:
      - echo "Running automated tests"
      - python -m pytest -q
  post_build:
    commands:
      - echo "Build and tests succeeded"
artifacts:
  files:
    - application.py
    - requirements.txt
    - Procfile
